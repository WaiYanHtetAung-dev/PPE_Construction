services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppe
      POSTGRES_PASSWORD: local_dev_password_change_me
      POSTGRES_DB: ppe
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ppe -d ppe']
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ppe_pgdata:/var/lib/postgresql/data
volumes:
  ppe_pgdata:
