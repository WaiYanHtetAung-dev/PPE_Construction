# Backend V2 standalone-repo CI. If nested under PPE_Construction/backend-v2/,
# relocate this workflow to the repository ROOT .github/workflows/ and set
# working-directory: backend-v2 (including checkout/test/migration commands).
name: Backend V2 CI
on:
  push:
    branches: ['main', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-contract-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile / import checks
        run: python -m compileall -q app tests scripts
      - name: Unit, API, contract, architecture, security regressions
        run: python -m pytest -q
      - name: Independent model/media boundary
        run: python scripts/check_architecture.py
      - name: Committed API/JSON Schema compatibility snapshots
        run: python scripts/verify_contracts.py

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ppe_ci
          POSTGRES_PASSWORD: ppe_ci_nonproduction
          POSTGRES_DB: ppe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppe_ci -d ppe_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ppe_ci:ppe_ci_nonproduction@127.0.0.1:5432/ppe_ci
      APP_ENV: ci
      ENABLE_API_DOCS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply initial + later migrations to empty PostgreSQL
        run: python -m alembic upgrade head
      - name: Check DB model / migration drift
        run: python -m alembic check
      - name: Ensure current revision reachable
        run: python -m alembic current
      - name: Verify publisher registration concurrency and metadata immutability
        run: |
          export PPE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL"
          python -m pytest -q tests/test_platform_models.py tests/test_camera_models.py tests/test_model_verification.py -k postgres
