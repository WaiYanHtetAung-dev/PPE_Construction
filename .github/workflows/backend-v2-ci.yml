# Copy this file to the REPOSITORY ROOT:
# .github/workflows/backend-v2-ci.yml
name: Backend V2 CI (monorepo)
on:
  pull_request:
    paths:
      - 'backend-v2/**'
      - '.github/workflows/backend-v2-ci.yml'
  push:
    branches: ['main', 'feature/**', 'fix/**']
    paths:
      - 'backend-v2/**'
      - '.github/workflows/backend-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend-v2

jobs:
  unit-contract-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-v2/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-inference-cpu.txt
      - run: python -c "import numpy, onnx, onnxruntime; from PIL import Image"
      - run: python -m compileall -q app inference_worker infra/onnx_export tests scripts
      - run: python -m pytest -q
      - run: python scripts/check_architecture.py
      - run: python scripts/verify_contracts.py
      - run: docker compose -f compose.yaml -f compose.inference.yaml --profile inference config -q

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ppe_ci
          POSTGRES_PASSWORD: ppe_ci_nonproduction
          POSTGRES_DB: ppe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppe_ci -d ppe_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ppe_ci:ppe_ci_nonproduction@127.0.0.1:5432/ppe_ci
      APP_ENV: ci
      ENABLE_API_DOCS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-v2/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic current
      - name: Verify concurrency, artifact eligibility and inference authority security
        run: |
          export PPE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL"
          python -m pytest -q tests/test_platform_models.py tests/test_camera_models.py tests/test_model_verification.py tests/test_inference_worker.py tests/test_incident_ingestion.py -k postgres
