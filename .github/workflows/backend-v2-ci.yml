# Copy this file to the REPOSITORY ROOT:
# .github/workflows/backend-v2-ci.yml
name: Backend V2 CI (monorepo)
on:
  pull_request:
    paths:
      - 'backend-v2/**'
      - '.github/workflows/backend-v2-ci.yml'
  push:
    branches: ['main', 'feature/**', 'fix/**']
    paths:
      - 'backend-v2/**'
      - '.github/workflows/backend-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend-v2

jobs:
  unit-contract-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-v2/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-inference-cpu.txt -r requirements-media-test.txt
      - run: python scripts/ci_checks.py backend
      - name: Synthetic video and inference v1 integration
        run: python scripts/ci_checks.py media
      - run: docker compose -f compose.yaml -f compose.inference.yaml --profile inference config -q

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ppe_ci
          POSTGRES_PASSWORD: ppe_ci_nonproduction
          POSTGRES_DB: ppe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppe_ci -d ppe_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ppe_ci:ppe_ci_nonproduction@127.0.0.1:5432/ppe_ci
      APP_ENV: ci
      ENABLE_API_DOCS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-v2/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/ci_checks.py postgres
