name: Synthetic Outbound Media CI

on:
  pull_request:
    paths: ['backend-v2/**', 'frontend-v2/**', '.github/workflows/outbound-media-ci.yml']
  push:
    branches: ['main', 'feature/**', 'fix/**']
    paths: ['backend-v2/**', 'frontend-v2/**', '.github/workflows/outbound-media-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtsp-srt-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-v2/requirements*.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sh frontend-v2/scripts/ci-build.sh
      - name: Install synthetic media tools
        run: sh backend-v2/scripts/install-synthetic-media-ci.sh
      - name: Verify outbound publishing and authorized browser playback
        working-directory: backend-v2
        run: |
          python -m pip install -r requirements-browser-smoke.txt -r requirements-media-test.txt
          python -m playwright install --with-deps chromium
          PPE_OUTBOUND_RUN=1 PPE_MEDIAMTX="$RUNNER_TEMP/mediamtx" python -m pytest -q --tb=short tests/media_outbound_integration.py
