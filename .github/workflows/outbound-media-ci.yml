name: Synthetic Outbound Media CI

on:
  pull_request:
    paths: ['backend-v2/**', 'frontend-v2/**', '.github/workflows/outbound-media-ci.yml']
  push:
    branches: ['main', 'feature/**', 'fix/**']
    paths: ['backend-v2/**', 'frontend-v2/**', '.github/workflows/outbound-media-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtsp-srt-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-v2/requirements*.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sh frontend-v2/scripts/ci-build.sh
      - name: Install synthetic media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          archive="$RUNNER_TEMP/mediamtx.tar.gz"
          curl --fail --location --silent --show-error --retry 3 -o "$archive" \
            https://github.com/bluenviron/mediamtx/releases/download/v1.21.3/mediamtx_v1.21.3_linux_amd64.tar.gz
          echo "0a2ea7eba96023631efa1bea7804823a9145b043b6646a8a05798d4ac24ed635  $archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP" mediamtx
      - name: Verify outbound publishing and authorized browser playback
        working-directory: backend-v2
        run: |
          python -m pip install -r requirements-browser-smoke.txt -r requirements-media-test.txt
          python -m playwright install --with-deps chromium
          PPE_OUTBOUND_RUN=1 PPE_MEDIAMTX="$RUNNER_TEMP/mediamtx" python -m pytest -q tests/media_outbound_integration.py
