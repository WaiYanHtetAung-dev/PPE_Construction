
name: PPE V2 Docker Build CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - main
    paths:
      - "frontend-v2/**"
      - "backend-v2/**"
      - ".github/workflows/docker-build-ci.yml"

  pull_request:
    paths:
      - "frontend-v2/**"
      - "backend-v2/**"
      - ".github/workflows/docker-build-ci.yml"

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-image:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build frontend image
        run: |
          docker build \
            --file frontend-v2/Dockerfile.ci \
            --tag ppe-frontend-ci:${{ github.sha }} \
            frontend-v2

      - name: Verify static files in image
        run: |
          docker run --rm \
            --network none \
            --entrypoint /bin/sh \
            ppe-frontend-ci:${{ github.sha }} \
            -c 'test -f /usr/share/nginx/html/index.html'

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ppe-frontend-ci:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'
          hide-progress: true


  backend-image:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build backend image
        run: |
          docker build \
            --file backend-v2/Dockerfile.ci \
            --tag ppe-backend-ci:${{ github.sha }} \
            backend-v2

      - name: Verify Python image
        run: |
          docker run --rm \
            --network none \
            --entrypoint python \
            ppe-backend-ci:${{ github.sha }} \
            --version

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ppe-backend-ci:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'
          hide-progress: true
      
      - name: Gate backend Python library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ppe-backend-ci:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

      - name: Gate backend critical OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ppe-backend-ci:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os
          severity: CRITICAL
          exit-code: '1'
          hide-progress: true


  backend-runtime-candidate:
    name: Backend Runtime Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build runtime candidate
        run: |
          docker build \
            --file backend-v2/Dockerfile.runtime-candidate \
            --tag ppe-backend-runtime:${{ github.sha }} \
            backend-v2

      - name: Verify non-root runtime
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --entrypoint /usr/bin/id \
            ppe-backend-runtime:${{ github.sha }} \
            -u | grep -qx 65532

      - name: Verify Python dependencies
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --entrypoint python \
            ppe-backend-runtime:${{ github.sha }} \
            -c 'import fastapi, sqlalchemy, psycopg, cryptography; print("PASS: Python imports")'

      - name: Scan runtime candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ppe-backend-runtime:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'
          hide-progress: true
