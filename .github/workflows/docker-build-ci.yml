
name: PPE V2 Docker Build CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - main
    paths:
      - "frontend-v2/**"
      - "backend-v2/**"
      - ".github/workflows/docker-build-ci.yml"

  pull_request:
    paths:
      - "frontend-v2/**"
      - "backend-v2/**"
      - ".github/workflows/docker-build-ci.yml"

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-image:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build frontend image
        run: |
          docker build \
            --file frontend-v2/Dockerfile.ci \
            --tag ppe-frontend-ci:${{ github.sha }} \
            frontend-v2

      - name: Verify static files in image
        run: |
          docker run --rm \
            --network none \
            --entrypoint /bin/sh \
            ppe-frontend-ci:${{ github.sha }} \
            -c 'test -f /usr/share/nginx/html/index.html'

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ppe-frontend-ci:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'
          hide-progress: true


  backend-image:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build backend image
        run: |
          docker build \
            --file backend-v2/Dockerfile.ci \
            --tag ppe-backend-ci:${{ github.sha }} \
            backend-v2

      - name: Verify Python image
        run: |
          docker run --rm \
            --network none \
            --entrypoint python \
            ppe-backend-ci:${{ github.sha }} \
            --version

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ppe-backend-ci:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'
          hide-progress: true
      
      - name: Gate backend Python library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ppe-backend-ci:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

      - name: Gate backend critical OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ppe-backend-ci:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os
          severity: CRITICAL
          exit-code: '1'
          hide-progress: true


  backend-runtime-candidate:
    name: Backend Runtime Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build runtime candidate
        run: |
          docker build \
            --file backend-v2/Dockerfile.runtime-candidate \
            --tag ppe-backend-runtime:${{ github.sha }} \
            backend-v2

      - name: Verify non-root runtime
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --entrypoint /usr/bin/id \
            ppe-backend-runtime:${{ github.sha }} \
            -u | grep -qx 65532

      - name: Verify Python dependencies
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --entrypoint python \
            ppe-backend-runtime:${{ github.sha }} \
            -c 'import fastapi, sqlalchemy, psycopg, cryptography; print("PASS: Python imports")'

      
      - name: Smoke test FastAPI runtime
        shell: bash
        run: |
          set -euo pipefail

          container="ppe-runtime-smoke-${{ github.run_id }}"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container" \
            --publish 127.0.0.1:18081:8000 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 512m \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --env APP_ENV=ci \
            --env DATABASE_URL=postgresql+psycopg://smoke:smoke@127.0.0.1:5432/smoke \
            ppe-backend-runtime:${{ github.sha }}

          echo "=== WAIT FOR FASTAPI ==="
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:18081/health/live \
              | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "FAIL: FastAPI did not become live"
            docker logs --tail 50 "$container"
            exit 1
          fi
          echo "PASS: LIVENESS HTTP 200"

          echo "=== AUTHENTICATION BOUNDARY ==="
          status=$(curl --silent --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 5 \
            http://127.0.0.1:18081/api/v1/auth/me)

          test "$status" = "401"
          echo "PASS: UNAUTHENTICATED HTTP 401"

          echo "=== DATABASE READINESS ==="
          status=$(curl --silent --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 5 \
            http://127.0.0.1:18081/health/ready)

          test "$status" = "503"
          echo "PASS: MISSING DATABASE RETURNS HTTP 503"

          echo "PASS: FASTAPI RUNTIME SMOKE TEST"
     
      - name: Scan runtime candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ppe-backend-runtime:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'
          hide-progress: true

  backend-postgres-integration:
    name: Backend PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build candidate image
        run: |
          docker build \
            -f backend-v2/Dockerfile.runtime-candidate \
            -t ppe-backend-pgci:${{ github.sha }} \
            backend-v2

      - name: Test PostgreSQL migration and FastAPI readiness
        shell: bash
        run: |
          set -euo pipefail

          network="ppe-pgci-${{ github.run_id }}"
          db="ppe-pgci-db"
          api="ppe-pgci-api"

          cleanup() {
            docker rm -f "$api" "$db" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network"

          docker run -d \
            --name "$db" \
            --network "$network" \
            --env POSTGRES_USER=ppe_ci \
            --env POSTGRES_PASSWORD=ci_only_test_password \
            --env POSTGRES_DB=ppe_ci \
            postgres:17

          echo "=== WAIT FOR POSTGRESQL ==="
          db_ready=0
          for i in $(seq 1 40); do
            if docker exec "$db" \
              pg_isready -U ppe_ci -d ppe_ci \
              >/dev/null 2>&1; then
              db_ready=1
              break
            fi
            sleep 2
          done
          test "$db_ready" -eq 1

          db_url="postgresql+psycopg://ppe_ci:ci_only_test_password@ppe-pgci-db:5432/ppe_ci"
          image="ppe-backend-pgci:${{ github.sha }}"

          echo "=== ALEMBIC MIGRATION ==="
          docker run --rm \
            --network "$network" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --env DATABASE_URL="$db_url" \
            --entrypoint python \
            "$image" \
            -m alembic -c alembic.ini upgrade head

          echo "=== CHECK MIGRATION REVISION ==="
          docker run --rm \
            --network "$network" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --env DATABASE_URL="$db_url" \
            --entrypoint python \
            "$image" \
            -m alembic -c alembic.ini current --check-heads

          echo "=== START FASTAPI ==="
          docker run -d \
            --name "$api" \
            --network "$network" \
            --publish 127.0.0.1:18082:8000 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 512m \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --env APP_ENV=ci \
            --env DATABASE_URL="$db_url" \
            "$image"

          echo "=== CHECK READINESS ==="
          api_ready=0
          for i in $(seq 1 30); do
            status=$(curl -sS -o /dev/null \
              -w '%{http_code}' --max-time 2 \
              http://127.0.0.1:18082/health/ready \
              2>/dev/null || true)

            if [ "$status" = "200" ]; then
              api_ready=1
              break
            fi
            sleep 1
          done

          if [ "$api_ready" -ne 1 ]; then
            echo "FAIL: Database readiness"
            docker logs --tail 30 "$api"
            exit 1
          fi

          echo "PASS: DATABASE READINESS HTTP 200"

          echo "=== CHECK AUTH BOUNDARY ==="
          status=$(curl -sS -o /dev/null \
            -w '%{http_code}' --max-time 5 \
            http://127.0.0.1:18082/api/v1/auth/me)

          test "$status" = "401"
          echo "PASS: UNAUTHENTICATED HTTP 401"

          echo "PASS: POSTGRESQL INTEGRATION"
